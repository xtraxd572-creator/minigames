<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novela Visual Web</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Pantalla principal del juego */
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background-color: #2a2a3a;
      border: 3px solid #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      background-size: cover;
      background-position: center;
    }

    /* Caja de Diálogo */
    #dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 130px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #6c5ce7;
      border-radius: 10px;
      padding: 15px 20px;
      cursor: pointer;
    }

    #character-name {
      font-weight: bold;
      font-size: 1.2rem;
      color: #a29bfe;
      margin-bottom: 8px;
    }

    #dialogue-text {
      font-size: 1rem;
      line-height: 1.4;
      color: #dfe6e9;
    }

    /* Contenedor de Opciones */
    #choices-container {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 60%;
      z-index: 10;
    }

    .choice-btn {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .choice-btn:hover {
      background: #a29bfe;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="choices-container"></div>
    <div id="dialogue-box">
      <div id="character-name">Cargando...</div>
      <div id="dialogue-text">Haz clic para iniciar.</div>
    </div>
  </div>

  <script>
    // --- GUION / ESTRUCTURA DE LA HISTORIA ---
    const story = {
      inicio: [
        {
          speaker: "Narrador",
          text: "Te despiertas en una habitación desconocida. La luz del sol entra suavemente por la ventana.",
          bg: "#2c3e50"
        },
        {
          speaker: "Misterioso Desconocido",
          text: "¡Al fin despiertas! Pensé que habías dormido por días.",
          bg: "#34495e"
        },
        {
          speaker: "Misterioso Desconocido",
          text: "¿Recuerdas cómo llegaste aquí?",
          bg: "#34495e",
          choices: [
            { text: "Decir la verdad: No recuerdo nada.", nextScene: "ruta_verdad" },
            { text: "Mentir: Sí, lo recuedo perfectamente.", nextScene: "ruta_mentira" }
          ]
        }
      ],
      ruta_verdad: [
        {
          speaker: "Misterioso Desconocido",
          text: "Entiendo... parece que la amnesia hizo su trabajo. No te preocupes, estás a salvo aquí.",
          bg: "#16a085"
        },
        {
          speaker: "Narrador",
          text: "FIN DEL DEMO (Ruta Sincera)."
        }
      ],
      ruta_mentira: [
        {
          speaker: "Misterioso Desconocido",
          text: "¿Ah sí? Mientes muy mal... pero me agrada tu entusiasmo.",
          bg: "#c0392b"
        },
        {
          speaker: "Narrador",
          text: "FIN DEL DEMO (Ruta Desconfiada)."
        }
      ]
    };

    // --- VARIABLES DE ESTADO ---
    let currentScene = "inicio";
    let currentStep = 0;

    // --- ELEMENTOS DEL DOM ---
    const gameContainer = document.getElementById("game-container");
    const nameEl = document.getElementById("character-name");
    const textEl = document.getElementById("dialogue-text");
    const choicesEl = document.getElementById("choices-container");
    const dialogueBox = document.getElementById("dialogue-box");

    // --- RENDERIZAR ESCENA Y DIÁLOGO ---
    function renderStep() {
      choicesEl.innerHTML = ""; // Limpiar opciones anteriores
      const step = story[currentScene][currentStep];

      nameEl.textContent = step.speaker;
      textEl.textContent = step.text;
      if (step.bg) gameContainer.style.backgroundColor = step.bg;

      // Si el paso tiene opciones, se muestran los botones
      if (step.choices) {
        step.choices.forEach(choice => {
          const btn = document.createElement("button");
          btn.className = "choice-btn";
          btn.textContent = choice.text;
          btn.onclick = (e) => {
            e.stopPropagation(); // Evitar avanzar por hacer clic en el botón
            changeScene(choice.nextScene);
          };
          choicesEl.appendChild(btn);
        });
      }
    }

    function advance() {
      const sceneSteps = story[currentScene];
      const step = sceneSteps[currentStep];

      // Si hay opciones activas, no avanzamos por clic normal
      if (step.choices && step.choices.length > 0) return;

      if (currentStep < sceneSteps.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function changeScene(newScene) {
      currentScene = newScene;
      currentStep = 0;
      renderStep();
    }

    // Evento para avanzar diálogo con clic en la caja de texto
    dialogueBox.addEventListener("click", advance);

    // Iniciar juego
    renderStep();
  </script>
</body>
</html>
